<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abajur Interativo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="github-area">

        <!-- CÉU -->
        <div class="ceu">

            <!-- SOL -->
            <div class="sol"></div>

            <!-- LUA -->
            <div class="lua"></div>

            <!-- ESTRELAS -->
            <div class="estrelas">
                <span class="estrela estrela1"></span>
                <span class="estrela estrela2"></span>
                <span class="estrela estrela3"></span>
                <span class="estrela estrela4"></span>
                <span class="estrela estrela5"></span>
                <span class="estrela estrela6"></span>
                <span class="estrela estrela7"></span>
                <span class="estrela estrela8"></span>
            </div>

            <!-- NUVENS -->
            <div class="nuvens">

                <div class="nuvem nuvem1">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="nuvem nuvem2">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>


        <!-- CENÁRIO -->
        <div class="cenario">

            <!-- ÁRVORE -->
            <div class="arvore">

                <div class="copa copa1"></div>
                <div class="copa copa2"></div>
                <div class="copa copa3"></div>

                <div class="tronco"></div>

            </div>


            <!-- MORCEGO -->
            <div class="morcego">
                <div class="asa esquerda"></div>
                <div class="corpo"></div>
                <div class="asa direita"></div>
            </div>


            <!-- CHÃO -->
            <div class="chao"></div>

        </div>


        <!-- ABAJUR -->
        <button class="abajur" id="abajur" aria-label="Acender ou apagar o abajur">

            <div class="cobertura"></div>

            <div class="haste"></div>

            <div class="base"></div>

            <div class="luz"></div>

        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
